name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Ephemeral CI-only credentials. Serverpod creates a throwaway database
      # for this job, so these are not secrets and must never be reused.
      SERVERPOD_PASSWORD_database: 'takt-ci-database'
      SERVERPOD_PASSWORD_redis: 'takt-ci-redis'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Run Serverpod tests
        working-directory: takt_server
        run: dart test

  flutter:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Run Flutter tests and visual goldens
        working-directory: takt_flutter
        run: flutter test --no-pub

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Build production web app
        working-directory: takt_flutter
        run: flutter build web --release
